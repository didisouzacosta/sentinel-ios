# Example app for SentinelKit. Regenerate the Xcode project with `xcodegen` after editing this file;
# the generated SentinelExample.xcodeproj is committed so nobody needs the tool to open it.
name: SentinelExample
options:
  bundleIdPrefix: com.didisouzacosta
  deploymentTarget:
    iOS: "17.0"
packages:
  SentinelKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SentinelExample:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: syncedFolder
    dependencies:
      - package: SentinelKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sentinel Example
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Development only: lets the app reach a local Sentinel over http (wrangler dev).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didisouzacosta.SentinelExample
    scheme:
      testTargets:
        - SentinelExampleTests
  SentinelExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: syncedFolder
    dependencies:
      - target: SentinelExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.didisouzacosta.SentinelExampleTests
